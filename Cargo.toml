[package]
name = "skill-bridge"
version = "0.2.0"
edition = "2021"
description = "Portable skills and context across AI coding agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AhmedShehab/skillbridge"
homepage = "https://github.com/AhmedShehab/skillbridge"
keywords = ["ai", "agents", "skills", "cli", "sync"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "skillbridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "1.1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"

[lints.rust]
unsafe_code = "forbid"
