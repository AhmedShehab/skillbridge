[package]
name = "agent-sync"
version = "0.1.0"
edition = "2021"
description = "Git-native synchronization for AI coding agent skills and instructions"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AhmedShehab/agent-sync"
homepage = "https://github.com/AhmedShehab/agent-sync"
keywords = ["ai", "agents", "skills", "cli", "sync"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"

[lints.rust]
unsafe_code = "forbid"
